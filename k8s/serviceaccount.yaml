# genaiops-event-processor'daki (EP) ayni ServiceAccount ile ayni gerekce: uygulama Kubernetes
# API'sine hic konusmuyor, ConfigMap/Secret'lar envFrom ile geliyor, Role/RoleBinding'e ihtiyac YOK.
# imagePullSecret EP ile AYNI ("vodafone-githubtest") — ayni private registry'den
# (containers.github.vpara.local) cekiyor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genaiops-core-processing-backend
  labels: { app: genaiops-core-processing-backend }
imagePullSecrets:
  - name: vodafone-githubtest
