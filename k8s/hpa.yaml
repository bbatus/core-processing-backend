apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genaiops-core-processing-backend
  labels: { app: genaiops-core-processing-backend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: genaiops-core-processing-backend }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
