# Repo'da GERCEK deger YOK — sablon. EP'nin k8s/secret.yaml + create-secret.sh yaklasimiyla ayni:
#   set -a; source k8s/.env.secret; set +a; envsubst < k8s/secret.yaml | oc apply -f -
