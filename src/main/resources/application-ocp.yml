# OCP profili — TUM degerler EP'nin zaten sahip oldugu genaiops-event-processor-config ConfigMap +
# genaiops-event-processor-secret Secret'inden gelir (envFrom, K2: paylasilan Postgres, ikinci bir
# DB kimlik bilgisi YOK). Hicbir varsayilan/localhost DEGERI YOKTUR — eksikse acilista hata verir
# (fail-fast), sessizce localhost'a dusmez.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    table: flyway_schema_history_cpb
    # Bkz. application-local.yml'deki ayni ayarin aciklamasi — sema EP'nin tablolariyla zaten dolu,
    # CPB'nin kendi history'si sifirdan baseline edilir, EP'nin tablolarina dokunulmaz.
    baseline-on-migrate: true
    baseline-version: "0"
