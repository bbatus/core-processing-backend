# Lokal/Docker simulasyonu icin — EP'nin application-local.yml'iyle AYNI mantik. OCP'de KULLANILMAZ
# (SPRING_PROFILES_ACTIVE=ocp ConfigMap'ten gelir, bu dosya hic yuklenmez).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:genaiops}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:genaiops}
    password: ${DB_PASSWORD:genaiops}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    # ⚠️ EP AYNI SEMADA kendi Flyway history'sini tutuyor (flyway_schema_history) — CPB KENDI ayri
    # history tablosunu kullanmak ZORUNDA, aksi halde iki servis birbirinin migration gecmisini
    # "kendi" sanip celisir/hata verir. Bkz. CPB_TASARIM_VE_GELISTIRME_PLANI §8.3.
    table: flyway_schema_history_cpb
    # Sema EP'nin tablolariyla ZATEN dolu (bos degil) ama CPB'nin KENDI history tablosu ilk
    # calistirmada yok — baselineOnMigrate olmadan Flyway bunu hata sayar ("non-empty schema but
    # no history table"). EP'nin tablolarina DOKUNULMAZ, yalnizca CPB'nin kendi history'si
    # sifirdan (baseline) baslatilir.
    baseline-on-migrate: true
    # ⚠️ baselineVersion varsayilani "1" — bizim ilk migration'imiz da V1 oldugu icin varsayilanla
    # birlikte kullanilirsa Flyway V1'i "baseline'a dahil, zaten uygulanmis" sayip ATLAR ve
    # ai_process/ai_interaction hic olusmaz. "0" ile baseline'i V1'den ONCEYE cekiyoruz ki V1
    # gercekten calissin.
    baseline-version: "0"

app:
  ai:
    base-url: ${AI_AGENT_BASE_URL:http://localhost:9090}
