spring:
  application:
    name: core-processing-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

app:
  ai:
    base-url: ${AI_AGENT_BASE_URL}
    fetch-path: ${AI_AGENT_FETCH_PATH:/api/v1/solutions/fetch}
    confirm-path: ${AI_AGENT_CONFIRM_PATH:/api/v1/solutions/confirm-status}
    api-key: ${AI_AGENT_API_KEY:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
    max-attempts: ${AI_MAX_ATTEMPTS:3}
    max-iterations: ${AI_MAX_ITERATIONS:5}
    note-author: ${AI_NOTE_AUTHOR:GenAI Ops}
    confirm-call-enabled: ${FLOW_AI_CONFIRM_ENABLED:false}
  dispatch:
    poll-interval-ms: ${DISPATCH_POLL_INTERVAL_MS:2000}
    batch-size: ${DISPATCH_BATCH_SIZE:5}
    claim-timeout-minutes: ${DISPATCH_CLAIM_TIMEOUT_MINUTES:15}

flow:
  enabled: ${FLOW_ENABLED:true}
  cpb-poll:
    enabled: ${FLOW_CPB_POLL_ENABLED:true}
  ai-call:
    enabled: ${FLOW_AI_CALL_ENABLED:true}
  inbox-write:
    enabled: ${FLOW_INBOX_WRITE_ENABLED:true}
  check-interval-ms: ${FLOW_CHECK_INTERVAL_MS:15000}

resilience4j:
  retry:
    instances:
      aiAgent:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      aiAgent:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      aiAgent:
        timeout-duration: 180s
